<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Contact Form</title>
  </head>
  <body>
    <main>
      <div class="form-container">
        <form action="" method="post">
          <h2>Contact Form</h2>
          <label for="name"
            >Name:
            <input
              type="text"
              id="name"
              name="name"
              placeholder="John Doe"
              required
            />
          </label>
          <label for="email"
            >Email:
            <input
              type="email"
              name="email"
              id="email"
              placeholder="johndoe@example.com"
              required
            />
          </label>
          <label for="message"
            >Message:
            <textarea
              name="message"
              id="message"
              cols="30"
              rows="10"
              placeholder="Write your message here..."
              required
            ></textarea>
          </label>
          <button type="submit">Submit</button>
        </form>
      </div>
    </main>
  </body>
</html>
