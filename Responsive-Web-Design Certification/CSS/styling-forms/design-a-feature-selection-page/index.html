<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Selection Feature Page</title>
  </head>
  <body>
    <h1>Feature Selection</h1>
    <div class="feature-card-container">
      <label for="cloud-storage" class="feature-card"
        ><input type="checkbox" name="features" id="cloud-storage" value="cloud-storage" />
        <h2>Cloud Storage</h2>
        <p>100 Gigabyte secure storage</p></label
      >
      <label for="dedicated-support" class="feature-card"
        ><input type="checkbox" name="features" id="dedicated-support" value="dedicated-support" />
        <h2>Dedicated Support</h2>
        <p>24/7 customer help</p></label
      >
      <label for="advanced-analytics" class="feature-card"
        ><input type="checkbox" name="features" id="advanced-analytics" value="advanced-analytics" />
        <h2>Advanced Analytics</h2>
        <p>Insights &amp; reports</p></label
      >
      <label for="custom-themes" class="feature-card"
        ><input type="checkbox" name="features" id="custom-themes" value="custom-themes" />
        <h2>Custom User Themes</h2>
        <p>Personalized dashboard design</p></label
      >
      <label for="multi-user-collab" class="feature-card"
        ><input type="checkbox" name="features" id="multi-user-collab" value="multi-user-collab" />
        <h2>Multi-User Collab</h2>
        <p>Team access and sharing</p></label
      >
      <label for="api-access" class="feature-card"
        ><input type="checkbox" name="features" id="api-access" value="api-access" />
        <h2>API Access</h2>
        <p>Integrate with your custom built tools</p></label
      >
    </div>
  </body>
</html>
