<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>My Study Plan</h1>
    <ul class="todo-list">
        <li>
            <input type="checkbox" id="html">
            <label for="html">Study HTML</label>
            <ul class="sub-item">
                <li><a href="https://developer.mozilla.org/en-US/docs/Web/HTML" class="sub-item-link" target="_blank">HTML guide on MDN</a></li>
            </ul>
        </li>
        <li>
            <input type="checkbox" id="css">
            <label for="css">Study CSS</label>
            <ul class="sub-item">
                <li><a href="https://developer.mozilla.org/en-US/docs/Web/CSS" class="sub-item-link" target="_blank">CSS guide on MDN</a></li>
            </ul>
        </li>
        <li>
            <input type="checkbox" id="js">
            <label for="js">Study JavaScript</label>
            <ul class="sub-item">
                <li><a href="https://developer.mozilla.org/en-US/docs/Web/JavaScript" class="sub-item-link" target="_blank">JavaScript guide on MDN</a></li>
            </ul>
        </li>
        <li>
            <input type="checkbox" id="node">
            <label for="node">Study Node.js</label>
            <ul class="sub-item">
                <li><a href="https://nodejs.org/docs/latest/api/" class="sub-item-link" target="_blank">Node.js documentation</a></li>
            </ul>
        </li>
    </ul>
</body>
</html>
