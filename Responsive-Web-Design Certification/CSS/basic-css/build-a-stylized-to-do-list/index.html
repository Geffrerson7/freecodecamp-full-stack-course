<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Mi plan de estudio</h1>
    <ul class="todo-list">
        <li>
            <input type="checkbox" id="html">
            <label for="html">Estudiar HTML</label>
            <ul class="sub-item">
                <li><a href="https://developer.mozilla.org/es/docs/Web/HTML" class="sub-item-link" target="_blank">Guía de HTML en MDN</a></li>
            </ul>
        </li>
        <li>
            <input type="checkbox" id="css">
            <label for="css">Estudiar CSS</label>
            <ul class="sub-item">
                <li><a href="https://developer.mozilla.org/es/docs/Web/CSS" class="sub-item-link" target="_blank">Guía de CSS en MDN</a></li>
            </ul>
        </li>
        <li>
            <input type="checkbox" id="js">
            <label for="js">Estudiar JavaScript</label>
            <ul class="sub-item">
                <li><a href="https://developer.mozilla.org/es/docs/Web/JavaScript" class="sub-item-link" target="_blank">Guía de JavaScript en MDN</a></li>
            </ul>
        </li>
        <li>
            <input type="checkbox" id="node">
            <label for="node">Estudiar Node.js</label>
            <ul class="sub-item">
                <li><a href="https://nodejs.org/docs/latest/api/" class="sub-item-link" target="_blank">Documentación de Node.js</a></li>
            </ul>
        </li>
    </ul>
</body>
</html>
