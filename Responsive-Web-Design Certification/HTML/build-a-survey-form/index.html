<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Form</title>
  </head>

  <body>
    <h1 id="title">freeCodeCamp Survey Form</h1>
    <p id="description">Thank you for taking the time to help us improve the platform</p>

    <form id="survey-form">
      <label id="name-label">Name</label>
      <input id="name" type="text" placeholder="Enter your name" required>

      <label id="email-label">Email</label>
      <input id="email" type="email" placeholder="Enter your email" required>

      <label id="number-label">Age (optional)</label>
      <input id="number" type="number" min="1" max="100" placeholder="Age">

      <p>Which option best describes your current role?</p>
      <select id="dropdown">
        <option value="">Select current role</option>
        <option value="student">Student</option>
        <option value="full-time-job">Full Time Job</option>
        <option value="full-time-learner">Full Time Learner</option>
        <option value="prefer-not-to/say">Prefer not to say</option>
        <option value="other">Other</option>
      </select>

      <p>Would you recommend freeCodeCamp to a friend?</p>

      <input type="radio" value="definetily" name="recommend">
      <label for="definetily">Definetily</label>

      <input type="radio" value="maybe" name="recommend">
      <label for="maybe">Maybe</label>

      <input type="radio" value="not-sure" name="recommend">
      <label for="not-sure">Not sure</label>

      <p>What would you like to see improved? (Check all that apply)</p>
      <input type="checkbox" value="front-end-projects">
      <label for="front-end-projects">Front-end Projects</label>
      <input type="checkbox" value="back-end-projects">
      <label for="back-end-projects">Back-end Projects</label>

      <p>Any comments or suggestions?</p>
      <textarea placeholder="Enter your comment here...">
      </textarea>
      <button id="submit">Submit</button>
    </form>
  </body>
</html>
